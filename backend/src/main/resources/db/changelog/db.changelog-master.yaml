# Liquibase master changelog — this service owns its schema and nothing else's.
# Add one file per change set under changes/ and include it here in order.
# Never edit an already-applied change set; add a new one.
databaseChangeLog:
  - include:
      file: db/changelog/changes/001-create-demo-showcase.yaml
  - include:
      file: db/changelog/changes/002-create-card-record.yaml
  - include:
      file: db/changelog/changes/003-support-failed-issue-retry.yaml

  - include:
      file: db/changelog/changes/004-seed-issuing-config.yaml

  - include:
      file: db/changelog/changes/005-add-card-reason-code.yaml